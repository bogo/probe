name: Probe
options:
  bundleIdPrefix: wtf.bogo
  deploymentTarget:
    macOS: "14.0"
packages:
  ProbeCore:
    path: Packages/ProbeCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1
targets:
  Probe:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/Probe/Sources
      - path: Apps/Probe/Resources
        buildPhase: resources
    dependencies:
      - package: ProbeCore
      - package: Sparkle
        product: Sparkle
    preBuildScripts:
      - name: Swift Syntax Lint
        basedOnDependencyAnalysis: false
        script: |
          /bin/sh "${SRCROOT}/Scripts/lint-swift.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wtf.bogo.probe
        PRODUCT_NAME: Probe
        INFOPLIST_FILE: Apps/Probe/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/Probe/Probe.entitlements
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SPARKLE_FEED_URL: https://raw.githubusercontent.com/bogo/probe/main/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: s48m7qBwEffcLdFGHWksFUUu1KhClI5kdva5nEWTUeA=
  ProbeSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/ProbeTests
      - path: Apps/Probe/Sources/HUDSettingsStore.swift
      - path: Apps/Probe/Sources/KeymapImportSupport.swift
      - path: Apps/Probe/Sources/KeymapArchiveImporter.swift
      - path: Apps/Probe/Sources/KeyboardHUDView.swift
      - path: Apps/Probe/Sources/MenuBarIconSettings.swift
      - path: Apps/Probe/Sources/RawHIDMonitor.swift
      - path: Apps/Probe/Sources/TypingMetricsStore.swift
    dependencies:
      - package: ProbeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wtf.bogo.probe.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
schemes:
  Probe:
    build:
      targets:
        Probe: all
        ProbeSnapshotTests: [test]
    test:
      targets:
        - ProbeSnapshotTests
